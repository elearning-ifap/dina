--police-titre:"Nunito","Segoe UI",system-ui,sans-serif;--police-texte:"Lato","Segoe UI",system-ui,sans-serif;--rayon:14px;--rayon-petit:10px;
--ombre:0 1px 2px rgba(15,61,92,.06),0 4px 14px rgba(15,61,92,.07);--ombre-forte:0 8px 28px rgba(15,61,92,.16);--focus:0 0 0 3px #fff,0 0 0 6px var(--bleu)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fond);color:var(--texte);font-family:var(--police-texte)}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-user-select:none;user-select:none}
header{padding:8px 14px 2px;background:#fff;border-bottom:1px solid var(--bordure)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top img{height:26px;width:auto;display:block}
.top span{font-size:12px;color:var(--texte-2);text-align:right}
#fil{display:flex;align-items:center;margin:8px 2px 0}
#fil i{width:12px;height:12px;border-radius:50%;background:#EDF0F3;border:2px solid #C9D2DB;flex:none}
#fil i.done{background:var(--turquoise);border-color:var(--turquoise)}
#fil i.now{background:var(--jaune);border-color:var(--jaune-fonce)}
#fil b{flex:1;height:2px;border-radius:2px;background:#D5DCE4}
#fil b.done{background:var(--turquoise)}
.q{margin:8px 0 8px;font-family:var(--police-titre);font-weight:800;font-size:17px;line-height:1.25;min-height:2.5em;color:var(--anthracite)}
#opts{display:none;gap:8px;flex-direction:column;padding:10px 14px 14px;overflow:auto}
#opts button{font:inherit;font-size:16px;text-align:left;padding:12px 14px;border:1.5px solid var(--bordure);border-radius:var(--rayon-petit);background:#fff;color:var(--texte);box-shadow:var(--ombre)}
#opts button:disabled{opacity:.5;text-decoration:line-through}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none}
#ask{position:absolute;left:10px;right:10px;top:34%;padding:14px 16px;text-align:center;background:rgba(255,255,255,.94);border:1px solid var(--bordure);border-radius:var(--rayon);box-shadow:var(--ombre-forte);font-family:var(--police-titre);font-weight:800;font-size:20px;line-height:1.25;color:var(--anthracite);opacity:0;pointer-events:none;transition:opacity .2s;z-index:3}
#ask.on{opacity:1}
#ask small{display:block;margin-top:6px;font-family:var(--police-texte);font-weight:400;font-size:13px;color:var(--texte-2)}
#toast{position:absolute;left:12px;right:12px;top:6px;padding:8px 12px;border-radius:var(--rayon-petit);background:var(--anthracite);color:#fff;font-size:13.5px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:.96}
#pad{display:flex;justify-content:center;gap:10px;padding:6px 12px 10px}
#pad button{width:64px;height:46px;border:1.5px solid var(--bordure);border-radius:var(--rayon-petit);background:#fff;color:var(--anthracite);font-size:18px;touch-action:manipulation;box-shadow:var(--ombre)}
#pad button:active{background:var(--bleu-clair)}
button:focus-visible{outline:none;box-shadow:var(--focus)}
.ov{position:fixed;inset:0;background:rgba(247,245,242,.94);display:none;align-items:center;justify-content:center;padding:18px;z-index:5}
.ov.on{display:flex}
.card{max-width:420px;width:100%;background:#fff;border:1px solid var(--bordure);border-radius:var(--rayon);padding:20px;box-shadow:var(--ombre-forte)}
.card .noa{display:block;width:72px;height:72px;border-radius:50%;margin:-4px auto 8px;box-shadow:var(--ombre)}
.card h2{margin:0 0 8px;font-family:var(--police-titre);font-weight:800;font-size:21px;color:var(--anthracite)}
.card h2.ok{color:var(--vert-texte)}
.card p{margin:0 0 10px;font-size:15.5px;line-height:1.5;color:var(--texte)}
.card .note{font-size:13px;color:var(--texte-2)}
.card button{font:inherit;font-weight:700;font-size:16px;width:100%;padding:13px;border-radius:var(--rayon-petit);border:0;background:var(--bleu);color:#fff;margin-top:6px}
.card button:hover{background:var(--bleu-survol)}
.card button.sec{background:#fff;color:var(--bleu);border:1.5px solid var(--bleu)}
.fiche{display:inline-block;color:var(--jaune-fonce);font-weight:700}
</style>
</head>

var cv=document.getElementById("cv"),ctx=cv.getContext("2d"),stage=document.getElementById("stage");
var ov=document.getElementById("ov"),card=document.getElementById("card");
var qtxt=document.getElementById("qtxt"),prog=document.getElementById("prog"),toastEl=document.getElementById("toast");
var optsEl=document.getElementById("opts"),padEl=document.getElementById("pad");

var grid=MAP.map(function(r){return r.split("")});
function free(x,y){return grid[y]&&grid[y][x]!==undefined&&grid[y][x]!=="#"}
function isRoom(x,y){var c=grid[y]&&grid[y][x];return c==="A"||c==="B"||c==="C"||c==="D"}
function bounds(L){var b={x0:99,y0:99,x1:-1,y1:-1};for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++)if(grid[y][x]===L){b.x0=Math.min(b.x0,x);b.y0=Math.min(b.y0,y);b.x1=Math.max(b.x1,x);b.y1=Math.max(b.y1,y)}return b}
var RB={A:bounds("A"),B:bounds("B"),C:bounds("C"),D:bounds("D")};

var ASK_MS=2000,askT=null,askEl=document.getElementById("ask");
var state="intro",mode="play",qi=0,first=0,hits=0,elapsed=0,tries=0;
var letterOf=[],labelOf={},wrong={},dim={},dots={},star=true;
var noa,ghosts,cur=null,want=null,frozen=0,invuln=0,wait=0,tmo=null,cell=20,ox=0,oy=0,tPulse=0;

function mk(x,y){return{tx:x,ty:y,nx:null,ny:null,t:0,dx:0,dy:0}}
function pos(e){return e.nx===null?[e.tx,e.ty]:[e.tx+(e.nx-e.tx)*e.t,e.ty+(e.ny-e.ty)*e.t]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function resetActors(){
  noa=mk(NOA_START[0],NOA_START[1]);cur=null;want=null;
  ghosts=GHOST_START.map(function(p){return mk(p[0],p[1])});
  wait=2;invuln=1.5;
}
function resetDots(){
  dots={};
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){
    var c=grid[y][x];
    if(c==="."||c==="S"){ if(c==="S"){}else dots[x+","+y]=true }
  }
  star=true;frozen=0;
}
function startQuestion(i){
  qi=i;tries=0;wrong={};dim={};
  var cq=Q[i];
  letterOf=shuffle(["A","B","C","D"]);labelOf={};
  for(var k=0;k<4;k++)labelOf[letterOf[k]]=cq.opts[k];
  qtxt.textContent=cq.q;prog.textContent="Question "+(i+1)+"/"+Q.length;renderFil(i);
  resetDots();resetActors();
  if(mode==="tap"){
    optsEl.innerHTML="";
    cq.opts.forEach(function(o,k){var b=document.createElement("button");b.textContent=o;b.addEventListener("click",function(){b.disabled=(k!==cq.ok);answer(k)});optsEl.appendChild(b)});
  }
  ov.classList.remove("on");
  if(mode==="play"){
    state="ask";
    askEl.innerHTML=cq.q+"<small>Prêt ? Ça démarre…</small>";askEl.classList.add("on");
    clearTimeout(askT);
    askT=setTimeout(function(){askEl.classList.remove("on");if(state==="ask"){resetActors();state="play"}},ASK_MS);
  }else{state="play"}
}
function renderFil(i){
  var h="";
  for(var k=0;k<Q.length;k++){
    h+="<i class='"+(k<i?"done":(k===i?"now":""))+"'></i>";
    if(k<Q.length-1)h+="<b class='"+(k<i?"done":"")+"'></b>";
  }
  document.getElementById("fil").innerHTML=h;
}
function setMode(m){
  mode=m;
  var tap=(m==="tap");
  stage.style.display=tap?"none":"flex";padEl.style.display=tap?"none":"flex";optsEl.style.display=tap?"flex":"none";
  resize();
}
function toast(t){toastEl.textContent=t;toastEl.classList.add("on");clearTimeout(tmo);tmo=setTimeout(function(){toastEl.classList.remove("on")},2000)}

function answer(k){
  if(state!=="play")return;
  var cq=Q[qi];
  if(k===cq.ok){
    if(tries===0)first++;
    state="fb";showFeedback();
  }else{
    tries++;wrong[letterOf[k]]=true;
    toast("Pas « "+cq.opts[k]+" ». Essaie une autre réponse.");
  }
}
function showFeedback(){
  var cq=Q[qi],last=(qi===Q.length-1);
  var extra=tries===0?"Du premier coup.":(tries===1?"Après 1 essai.":"Après "+tries+" essais.");
  card.innerHTML="<h2 class='ok'>Bien vu ! ✔</h2><p><b>"+cq.opts[cq.ok]+"</b></p><p>"+cq.why+"</p><p class='note'>"+extra+"</p><button id='nx'>"+(last?"Voir mon bilan":"Question suivante")+"</button>";
  ov.classList.add("on");
  document.getElementById("nx").onclick=function(){if(last)showEnd();else startQuestion(qi+1)};
}
function showEnd(){
  state="end";
  var m=Math.floor(elapsed/60),s=Math.round(elapsed%60);
  card.innerHTML="<h2>Bilan du mini-jeu</h2><p>Réponses justes du premier coup : <b>"+first+"/"+Q.length+"</b></p>"+
   (mode==="play"?"<p>Idées reçues rencontrées : <b>"+hits+"</b><br>Temps de jeu : <b>"+m+" min "+(s<10?"0":"")+s+" s</b></p>":"")+
   "<p class='note'>Ce jeu n'est pas noté : il ne compte ni dans la validation du module ni dans le badge.</p><button id='rp'>Rejouer</button>";
  ov.classList.add("on");
  document.getElementById("rp").onclick=function(){first=0;hits=0;elapsed=0;startQuestion(0)};
}
function showIntro(){
  card.innerHTML="<img class='noa' src='"+NOA_SRC+"' alt='Noa'><h2>Noa dans le dédale</h2>"+
  "<p>Guide Noa jusqu'à la salle qui répond à la question. Évite les <b>idées reçues</b> (les fantômes <b>?</b>) : si l'une te touche, tu repars du départ, sans pénalité.</p>"+
  "<p>Ramasse la fiche repère <span class='fiche'>★</span> : elle fige les idées reçues et écarte deux mauvaises réponses.</p>"+
  "<p class='note'>Glisse le doigt, utilise les flèches ou les touches du clavier. Prototype : questions provisoires, à valider avec le corpus M1.</p>"+
  "<button id='go'>Jouer</button><button class='sec' id='tp'>Répondre sans jouer (sans déplacement)</button>";
  ov.classList.add("on");
  document.getElementById("go").onclick=function(){setMode("play");first=0;hits=0;elapsed=0;startQuestion(0)};
  document.getElementById("tp").onclick=function(){setMode("tap");first=0;hits=0;elapsed=0;startQuestion(0)};
}

/* ---- mouvement ---- */
var NOA_SPEED=4.6,GHOST_SPEED=2.3;
function onTile(){
  var key=noa.tx+","+noa.ty;
  if(dots[key])delete dots[key];
  if(star&&grid[noa.ty][noa.tx]==="S"){
    star=false;frozen=6;
    var cands=[];for(var k=0;k<4;k++)if(k!==Q[qi].ok&&!wrong[letterOf[k]])cands.push(letterOf[k]);
    shuffle(cands).slice(0,2).forEach(function(L){dim[L]=true});
    toast("Fiche repère ! Idées reçues figées, deux mauvaises réponses écartées.");
  }
  if(isRoom(noa.tx,noa.ty)){
    var L=grid[noa.ty][noa.tx];
    if(!wrong[L]&&!dim[L]){answer(letterOf.indexOf(L))}
  }
}
function moveNoa(dt){
  var rem=dt*NOA_SPEED,guard=0;
  while(rem>0&&guard++<10){
    if(noa.nx===null){
      var d=null;
      if(want&&free(noa.tx+want[0],noa.ty+want[1])){d=want;want=null}
      else if(cur&&free(noa.tx+cur[0],noa.ty+cur[1]))d=cur;
      if(!d)return;
      cur=d;noa.nx=noa.tx+d[0];noa.ny=noa.ty+d[1];noa.t=0;
    }else if(cur&&want&&want[0]===-cur[0]&&want[1]===-cur[1]){
      var a=noa.tx,b=noa.ty;noa.tx=noa.nx;noa.ty=noa.ny;noa.nx=a;noa.ny=b;noa.t=1-noa.t;cur=want;want=null;
    }
    var need=1-noa.t;
    if(rem>=need){rem-=need;noa.tx=noa.nx;noa.ty=noa.ny;noa.nx=null;noa.ny=null;noa.t=0;onTile();if(state!=="play")return}
    else{noa.t+=rem;rem=0}
  }
}
function moveGhost(g,dt){
  var rem=dt*GHOST_SPEED,guard=0;
  while(rem>0&&guard++<10){
    if(g.nx===null){
      var all=DIRS.filter(function(d){return free(g.tx+d[0],g.ty+d[1])&&!isRoom(g.tx+d[0],g.ty+d[1])});
      var list=all.filter(function(d){return !(g.dx===-d[0]&&g.dy===-d[1])});
      if(!list.length)list=all;
      if(!list.length)return;
      var d;
      if(Math.random()<0.5){
        var nt=noa.nx===null?[noa.tx,noa.ty]:[noa.nx,noa.ny];
        list.sort(function(p,q){return (Math.abs(g.tx+p[0]-nt[0])+Math.abs(g.ty+p[1]-nt[1]))-(Math.abs(g.tx+q[0]-nt[0])+Math.abs(g.ty+q[1]-nt[1]))});
        d=list[0];
      }else d=list[Math.floor(Math.random()*list.length)];
      g.dx=d[0];g.dy=d[1];g.nx=g.tx+d[0];g.ny=g.ty+d[1];g.t=0;
    }
    var need=1-g.t;
    if(rem>=need){rem-=need;g.tx=g.nx;g.ty=g.ny;g.nx=null;g.ny=null;g.t=0}
    else{g.t+=rem;rem=0}
  }
}
function update(dt){
  elapsed+=dt;tPulse+=dt;
  if(invuln>0)invuln-=dt;
  moveNoa(dt);
  if(state!=="play")return;
  if(frozen>0)frozen-=dt;
  if(wait>0)wait-=dt;
  else if(frozen<=0)ghosts.forEach(function(g){moveGhost(g,dt)});
  if(invuln<=0&&frozen<=0){
    var p=pos(noa);
    for(var i=0;i<ghosts.length;i++){
      var q=pos(ghosts[i]);
      if(Math.hypot(p[0]-q[0],p[1]-q[1])<0.65){
        hits++;toast("Une idée reçue t'a rattrapé ! Retour au départ.");
        resetActors();break;
      }
    }
  }
}

/* ---- dessin ---- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawNoa(cx,cy,r){
  var R=r*1.32;
  ctx.save();
  ctx.shadowColor="rgba(15,61,92,.28)";ctx.shadowBlur=R*0.35;ctx.shadowOffsetY=R*0.12;
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.clip();
  if(noaImg.complete&&noaImg.naturalWidth)ctx.drawImage(noaImg,cx-R,cy-R,2*R,2*R);
  else{ctx.fillStyle="#00B2B8";ctx.fillRect(cx-R,cy-R,2*R,2*R)}
  ctx.restore();
  ctx.lineWidth=Math.max(1.5,R*0.1);ctx.strokeStyle="#00B2B8";ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();
}
function drawGhost(cx,cy,r,col){
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(cx,cy-r*0.1,r,Math.PI,0);
  ctx.lineTo(cx+r,cy+r*0.9);
  var w=2*r/3;
  for(var i=0;i<3;i++)ctx.quadraticCurveTo(cx+r-w*i-w/2,cy+r*0.45,cx+r-w*(i+1),cy+r*0.9);
  ctx.closePath();ctx.fill();
  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.arc(cx-r*0.35,cy-r*0.3,r*0.22,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(cx+r*0.35,cy-r*0.3,r*0.22,0,7);ctx.fill();
  ctx.fillStyle="#2D3748";
  ctx.beginPath();ctx.arc(cx-r*0.35,cy-r*0.28,r*0.1,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(cx+r*0.35,cy-r*0.28,r*0.1,0,7);ctx.fill();
  ctx.fillStyle="#fff";ctx.font="bold "+Math.round(r*0.85)+"px system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("?",cx,cy+r*0.42);
}
function wrapLines(t,maxW){
  var words=t.split(" "),lines=[],line="";
  words.forEach(function(w){var test=line?line+" "+w:w;if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=w}else line=test});
  if(line)lines.push(line);return lines;
}
function draw(){
  var dpr=window.devicePixelRatio||1;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  var c=cell;
  /* murs */
  ctx.fillStyle="#fff";rr(0,0,c*COLS,c*ROWS,c*0.3);ctx.fill();ctx.fillStyle="#D5DCE4";
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++)if(grid[y][x]==="#"){rr(x*c+1,y*c+1,c-2,c-2,c*0.22);ctx.fill()}
  /* points */
  ctx.fillStyle="#C9D2DB";
  Object.keys(dots).forEach(function(k){var p=k.split(",");ctx.beginPath();ctx.arc((+p[0]+0.5)*c,(+p[1]+0.5)*c,c*0.09,0,7);ctx.fill()});
  /* salles */
  ["A","B","C","D"].forEach(function(L){
    var b=RB[L],x=b.x0*c+2,y=b.y0*c+2,w=(b.x1-b.x0+1)*c-4,h=(b.y1-b.y0+1)*c-4;
    var isW=wrong[L],isD=dim[L];
    ctx.globalAlpha=(isD||isW)?0.4:1;
    ctx.fillStyle=isW?"#FBE9E9":ROOM_COL[L][0];rr(x,y,w,h,c*0.3);ctx.fill();
    ctx.lineWidth=2;ctx.strokeStyle=isW?"#C62828":ROOM_COL[L][1];ctx.stroke();
    ctx.fillStyle="#2D3748";ctx.textAlign="center";ctx.textBaseline="middle";
    var fs=Math.max(9,Math.round(c*0.36));ctx.font="800 "+fs+"px Nunito,system-ui,sans-serif";
    var lines=wrapLines(labelOf[L]||"",w-8),lh=fs*1.15,y0=y+h/2-(lines.length-1)*lh/2;
    lines.forEach(function(ln,i){ctx.fillText(ln,x+w/2,y0+i*lh)});
    if(isW){ctx.font="bold "+Math.round(c*0.5)+"px system-ui,sans-serif";ctx.fillStyle="#A31F1F";ctx.fillText("✕",x+w-c*0.35,y+c*0.4)}
    ctx.globalAlpha=1;
  });
  /* étoile */
  if(star){
    var s=1+0.12*Math.sin(tPulse*5);
    ctx.font="bold "+Math.round(c*0.95*s)+"px system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.lineWidth=2;ctx.strokeStyle="#997A00";ctx.strokeText("★",5.5*c,5.5*c+1);ctx.fillStyle="#FFCB00";ctx.fillText("★",5.5*c,5.5*c+1);
  }
  /* fantômes */
  var fr=frozen>0;
  ghosts.forEach(function(g){
    var p=pos(g),col=fr?((frozen<1.5&&Math.floor(tPulse*6)%2)?"#7C6EAF":"#63B8E8"):"#7C6EAF";
    drawGhost((p[0]+0.5)*c,(p[1]+0.5)*c,c*0.4,col);
  });
  /* Noa */
  var pn=pos(noa);
  if(invuln>0&&Math.floor(tPulse*10)%2)ctx.globalAlpha=0.5;
  drawNoa((pn[0]+0.5)*c,(pn[1]+0.5)*c,c*0.38);
  ctx.globalAlpha=1;
}
function resize(){
  if(mode==="tap")return;
  var W=stage.clientWidth,H=stage.clientHeight;
  cell=Math.max(14,Math.floor(Math.min(W/COLS,H/ROWS)));
  var dpr=window.devicePixelRatio||1;
  cv.style.width=cell*COLS+"px";cv.style.height=cell*ROWS+"px";
  cv.width=Math.round(cell*COLS*dpr);cv.height=Math.round(cell*ROWS*dpr);
}
window.addEventListener("resize",resize);

/* ---- commandes ---- */
var DV={L:[-1,0],R:[1,0],U:[0,-1],D:[0,1]};
Array.prototype.forEach.call(padEl.querySelectorAll("button"),function(b){
  b.addEventListener("pointerdown",function(e){e.preventDefault();want=DV[b.getAttribute("data-d")]});
});
document.addEventListener("keydown",function(e){
  var k=e.key.toLowerCase(),d=null;
  if(k==="arrowleft"||k==="q"||k==="a")d=DV.L;
  else if(k==="arrowright"||k==="d")d=DV.R;
  else if(k==="arrowup"||k==="z"||k==="w")d=DV.U;
  else if(k==="arrowdown"||k==="s")d=DV.D;
  if(d){want=d;e.preventDefault()}
});
var sx=0,sy=0,sw=false;
cv.addEventListener("pointerdown",function(e){sx=e.clientX;sy=e.clientY;sw=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener("pointermove",function(e){
  if(!sw)return;
  var dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))>16){
    want=Math.abs(dx)>Math.abs(dy)?(dx>0?DV.R:DV.L):(dy>0?DV.D:DV.U);
    sx=e.clientX;sy=e.clientY;
  }
});
cv.addEventListener("pointerup",function(){sw=false});
cv.addEventListener("pointercancel",function(){sw=false});

/* ---- boucle ---- */
var last=0;
function frame(ts){
  var dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  if(state==="play"&&mode==="play")update(dt);
  else tPulse+=dt;
  if(mode==="play")draw();
  requestAnimationFrame(frame);
}
resetDots();resetActors();
labelOf={};
resize();showIntro();
requestAnimationFrame(frame);
})();
</script>
